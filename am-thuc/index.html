<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg"/>
<title>Ẩm thực Nga — Quán ăn theo thành phố · Cẩm nang Du lịch</title>
<meta name="description" content="Chọn thành phố bạn đang ở hoặc sắp đến (Moskva, Sergiev Posad, Kolomna, Zvenigorod, Istra, Pereslavl-Zalessky, Plyos, Saint Petersburg) để xem quán ăn và thực đơn 3 ngôn ngữ Việt/Anh/Nga — chọn món để lên kế hoạch bữa ăn và xuất ra nhiều định dạng."/>
<style>
:root{--navy:#152c4e;--navy2:#0f2138;--gold:#c8a24b;--gold2:#a9863a;--ink:#1e2733;--muted:#5c6773;--line:#e7e3d6;--card:#fff;--soft:#efeadd;--red:#b23b34;--green:#3c7a4e}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#f7f4ec;line-height:1.5;-webkit-text-size-adjust:100%}
a{text-decoration:none;color:inherit}
button{font-family:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
/* ---------- thanh trên cùng (dính) ---------- */
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:10px 0;position:sticky;top:0;z-index:50;box-shadow:0 3px 14px rgba(10,20,35,.28)}
.toprow{display:flex;align-items:center;gap:10px}
.home{flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:16px}
.ttl{min-width:0;flex:1 1 auto}
.k{letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:var(--gold);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero h1{font-size:16px;margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langbar{display:flex;gap:5px;flex:0 0 auto}
.langbar button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:6px 8px;font-weight:800;font-size:12px;cursor:pointer;min-height:36px}
.langbar button.on{background:var(--gold);border-color:var(--gold);color:#1a1305}
.bar{display:flex;gap:8px;margin-top:9px}
.citybtn{flex:0 1 auto;max-width:46%;display:flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:11px;padding:0 11px;font-weight:800;font-size:13.5px;cursor:pointer;min-height:44px;white-space:nowrap}
.citybtn .n{overflow:hidden;text-overflow:ellipsis}
.citybtn .caret{font-size:11px;opacity:.8}
.citybtn.on{background:var(--gold);border-color:var(--gold);color:#1a1305}
.searchwrap{position:relative;flex:1 1 auto;min-width:0}
#q{width:100%;height:44px;border:none;border-radius:11px;padding:0 38px 0 13px;font-size:16px;font-family:inherit;color:var(--ink)}
#qx{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:#e7e9ef;color:#556;border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer;display:none}
main{padding:14px 0 96px}
/* ---------- trang chọn thành phố ---------- */
.intro h2{font-size:18px;color:var(--navy);margin:4px 0 4px;line-height:1.3}
.intro p{margin:0;color:var(--muted);font-size:13.5px}
.rhead{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-size:15.5px;color:var(--navy);margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.rhead .ricon{font-size:18px}
.rhead .rsub{font-size:12.5px;color:var(--muted);font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}
.ccard,.rcard{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 5px 14px rgba(20,30,50,.05);transition:border-color .15s,transform .1s}
.ccard{padding:12px 12px 11px;gap:3px}
.ccard:hover,.rcard:hover{border-color:var(--navy)}
.ccard:active,.rcard:active{transform:scale(.99)}
.cname{font-size:16px;font-weight:800;color:var(--navy);line-height:1.25;overflow-wrap:anywhere}
.cru{font-size:12.5px;color:var(--muted);font-style:italic;font-weight:500}
.ccard .cru{display:block;font-size:12px}
.cmeta{font-size:12.3px;color:var(--muted)}
.cnames{font-size:12.3px;color:#48505a;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;padding-top:8px}
.cnum{background:var(--soft);color:var(--navy);border-radius:999px;padding:3px 9px;font-size:11.8px;font-weight:800;white-space:nowrap}
.cgo{color:var(--gold2);font-weight:800;font-size:13px;white-space:nowrap}
.cgot,.h1x{display:none}
/* ---------- đầu trang thành phố / quán ---------- */
.chead{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:10px 14px 13px;margin-bottom:12px}
.crumb{display:inline-block;color:var(--gold2);font-weight:800;font-size:13px;padding:5px 0}
.chead h2{margin:2px 0;font-size:20px;color:var(--navy);line-height:1.25}
.chead .rus{font-size:13px;color:var(--muted);font-style:italic}
.cstat{font-size:12.8px;color:var(--navy);font-weight:700;margin-top:4px}
.cacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.act{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--gold);color:var(--gold2);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:800;min-height:40px}
.about{font-size:13.5px;color:#454c54;margin:8px 0 0}
.info{font-size:12.8px;color:#48505a;margin-top:8px;line-height:1.6}
/* ---------- bộ lọc trong thành phố ---------- */
.filters{margin:0 0 4px}
.selrest{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;min-height:42px;color:var(--ink)}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:thin}
.chip{background:#fff;border:1px solid var(--line);color:var(--navy);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;flex:0 0 auto;min-height:36px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.veg.on{background:var(--green);border-color:var(--green)}
h3.sec{font-size:14.5px;color:var(--navy);display:flex;align-items:center;gap:8px;margin:16px 0 9px}
h3.sec .bar{width:4px;height:16px;background:var(--gold);border-radius:2px;flex:0 0 auto}
h4.csec{font-size:13px;color:#40506a;margin:14px 0 8px;display:flex;align-items:center;gap:7px}
h4.csec:before{content:"";width:4px;height:13px;background:var(--gold);border-radius:2px}
h4.csec span{color:var(--muted);font-weight:600}
/* ---------- thẻ quán ---------- */
.rtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rcard h4{margin:0;font-size:15.5px;color:var(--navy);line-height:1.3}
.rru{font-size:12px;color:var(--muted);font-style:italic}
.mt{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.tag{background:var(--soft);color:var(--navy);border-radius:6px;padding:2px 7px;font-size:10.8px;font-weight:700}
.tag.lux{background:#f3e6c8;color:#8a6a1e}
.cz{font-size:12.4px;color:#48505a}
.rab{font-size:12.4px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ---------- thành phố lân cận, kết quả nhóm theo thành phố ---------- */
.near{margin-top:22px;padding-top:12px;border-top:1px dashed #d9d2bd}
.near h4{margin:0 0 8px;font-size:13px;color:var(--muted)}
.nl,.quick{display:flex;gap:7px;flex-wrap:wrap}
.quick{margin:2px 0 4px}
.qchip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.8px;font-weight:700;color:var(--navy);min-height:36px}
.qchip.city{border-color:var(--gold);color:var(--gold2)}
.cgroup{margin-top:14px}
.cghead{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:13.5px}
.cghead a{color:var(--gold);font-weight:800;font-size:12.5px;white-space:nowrap}
a.b.rest{text-decoration:none}
.lnk{color:var(--gold2);font-weight:800;font-style:normal}
.dish{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dn{font-weight:800;color:var(--navy);font-size:14.6px}
.dnwrap{flex:1 1 auto;min-width:0}
.dn2{font-size:12.6px;margin-top:2px;line-height:1.4;color:#5c6773}
.dn2 .nru{color:#1a4e86;font-weight:700}
.dn2 .nen{font-style:italic}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.b{font-size:10.4px;font-weight:700;border-radius:6px;padding:2px 7px}
.b.rest{background:#eaf0f8;color:var(--navy)}
.b.cat{background:#f2ecdd;color:var(--gold2)}
.b.veg{background:#e6f2ea;color:var(--green)}
.b.spicy{background:#fbe9e7;color:var(--red)}
.dp{white-space:nowrap;text-align:right}.wt{color:var(--muted);font-size:11.5px;margin-right:5px}.price{color:var(--red);font-weight:800;font-size:14px}
.di{color:#454c54;font-size:13px;margin-top:3px}
.tip{background:#fff8ec;border-left:3px solid var(--gold);border-radius:6px;padding:5px 9px;margin-top:6px;font-size:12.3px;color:#5a4a1e}
.addp{margin-top:7px;border:1px solid var(--gold);background:#fff;color:var(--gold2);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:800;cursor:pointer;min-height:36px}
.addp.in{background:var(--green);border-color:var(--green);color:#fff}
.empty{color:var(--muted);text-align:center;padding:26px;font-style:italic}
/* meal-plan tray */
#tray{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--navy);color:#fff;box-shadow:0 -6px 22px rgba(0,0,0,.32);transform:translateY(calc(100% - 46px));transition:transform .25s;padding-bottom:env(safe-area-inset-bottom)}
#tray.open{transform:translateY(0)}
.trayhead{height:46px;display:flex;align-items:center;gap:9px;padding:0 14px;cursor:pointer;font-weight:800;font-size:13.5px}
.trayhead .pill{background:var(--gold);color:#1a1305;border-radius:999px;padding:1px 9px;font-size:12px;min-width:22px;text-align:center}
.trayhead .cev{margin-left:auto;font-size:12px;color:#aebdd0}
.traybody{max-height:56vh;overflow:auto;padding:4px 14px 16px}
.pi{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(255,255,255,.12);padding:7px 0;font-size:13px}
.pi .x{cursor:pointer;color:#ffd0cc;font-weight:800;padding:0 4px}
#planlabel{width:100%;border:none;border-radius:8px;padding:9px 11px;font-family:inherit;font-size:13.5px;margin:8px 0}
.exports{display:flex;gap:7px;flex-wrap:wrap}
.exports button{border:none;border-radius:9px;padding:9px 12px;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit;min-height:38px}
.bx{background:var(--gold);color:#1a1305}.bclr{background:#33465f;color:#fff}
footer{padding:14px;text-align:center;color:var(--muted);font-size:11.5px}
@media (min-width:760px){
  .hero{padding:13px 0 12px}.hero h1{font-size:19px}.k{font-size:10.5px}
  .chips{flex-wrap:wrap;overflow:visible}
  #q{font-size:15px}
  .citybtn{max-width:340px}
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
  .ccard{padding:14px}
  .cname{font-size:17px}
  .cgot,.h1x{display:inline}
}

<script>
var DB = window.MENU_DB || {restaurants:[],dishes:[],categories:{}};
var LANG='vi', CITY='', REST='', CAT='', Q='', VEG=false;
var REST_BY={}; DB.restaurants.forEach(function(r){REST_BY[r.id]=r;});
function norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d'); }
function catLabel(slug,l){ var c=DB.categories[slug]; l=l||LANG; return c?(c[l]||c.vi):slug; }
function L(o,base){ return o ? (o[base+'_'+LANG] || o[base+'_vi'] || o[base+'_en'] || '') : ''; }
function tr(vi,en,ru){ return LANG==='en'?en:(LANG==='ru'?ru:vi); }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function slugify(s){ return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'x'; }
// Tên gọn của quán: lấy phần trong «…» nếu có, nếu không bỏ phần (mô tả) và "— mô tả"
function shortName(r){ if(!r) return ''; var s=L(r,'name')||r.brand||r.id||''; var m=s.match(/«([^»]+)»/); if(m) return m[1].trim();
  var t=s.replace(/\s*\([^)]*\)/g,'').replace(/\s+[—–-]\s+.*$/,'').trim(); return t||s; }
var TYPES={restaurant:['🍽','Nhà hàng','Restaurant','Ресторан'],traktir:['🪵','Quán traktir (kiểu Nga)','Traktir','Трактир'],
           cafe:['☕','Café · bánh · quán nhỏ','Café','Кафе'],chain:['🔗','Chuỗi bình dân','Chain','Сеть']};
function typeTag(r){ var t=TYPES[r.type]; return t?'<span class="tag">'+t[0]+' '+esc(tr(t[1],t[2],t[3]))+'</span>':''; }
function priceTag(r){ if(!r.price_level) return ''; var lux=(r.price_level==='₽₽₽₽'); return '<span class="tag'+(lux?' lux':'')+'" title="'+esc(tr('Mức giá','Price level','Уровень цен'))+'">'+esc(r.price_level)+(lux?' ✦':'')+'</span>'; }
function nQuan(n){ return n+' '+tr('quán','places','заведений'); }
function nMon(n){ return n+' '+tr('món','dishes','блюд'); }

// ---------- chỉ mục tìm kiếm: gộp mọi trường (tên/mô tả 3 ngôn ngữ + lưu ý + tags + danh mục + tên quán) ----------
DB.dishes.forEach(function(d){
  var r=REST_BY[d.rid]||{};
  var names=[d.name_vi,d.name_en,d.name_ru].join(' ');
  var all=[d.name_vi,d.name_en,d.name_ru,d.intro_vi,d.intro_en,d.intro_ru,d.tips_vi,(d.tags||[]).join(' '),
    catLabel(d.cat,'vi'),catLabel(d.cat,'en'),catLabel(d.cat,'ru'),r.name_vi,r.name_en,r.name_ru].join(' ');
  d._s=norm(all); d._sn=norm(names); d._raw=(all||'').toString().toLowerCase(); d._rawn=(names||'').toString().toLowerCase();
});
function scoreOf(d,terms,rawterms){
  var s=0;
  for(var i=0;i<rawterms.length;i++){ var tw=rawterms[i]; if(!tw)continue; if(d._rawn.indexOf(tw)>=0) s+=200; else if(d._raw.indexOf(tw)>=0) s+=80; }
  var alln=true; for(var j=0;j<terms.length;j++){ if(d._sn.indexOf(terms[j])<0){alln=false;break;} } if(alln) s+=30;
  if(terms.length && d._sn.indexOf(terms[0])===0) s+=12;
  return s;
}
function sortByScore(list){ var terms=norm(Q).split(/\s+/).filter(Boolean), raw=Q.toLowerCase().split(/\s+/).filter(Boolean);
  return list.slice().sort(function(a,b){ return scoreOf(b,terms,raw)-scoreOf(a,terms,raw); }); }

// ---------- MÔ HÌNH THÀNH PHỐ: quán thuộc thành phố nào, thành phố thuộc vùng nào ----------
// Nguồn: data/cities.js (FOOD_CITIES) -> dự phòng: MENU_DB.cities -> dự phòng cuối: tự gom theo restaurant.cities
var REGIONS=[], REGION_BY={}, CITIES=[], CITY_BY={};
(function(){
  var FC=window.FOOD_CITIES||{};
  var src=(FC.cities&&FC.cities.length)?FC:{regions:DB.regions||[],cities:DB.cities||[]};
  var cfg=(src.cities||[]).map(function(c){ var o={}; for(var k in c) o[k]=c[k]; return o; });
  REGIONS=(src.regions||[]).slice();
  var M={}, CFG={};
  function addM(n,k){ if(n) M[String(n).trim().toLowerCase()]=k; }
  cfg.forEach(function(c){ CFG[c.key]=c; [c.key,c.name_vi,c.name_en,c.name_ru].concat(c.match||[]).forEach(function(n){ addM(n,c.key); }); });
  (DB.cities||[]).forEach(function(c){ (c.match||[]).forEach(function(n){ if(CFG[c.key]) addM(n,c.key); }); });
  var adhoc={};
  function ensure(k,name){ if(CFG[k]||adhoc[k]) return; var dc=(DB.cities||[]).filter(function(c){return c.key===k;})[0];
    adhoc[k]=dc?{key:dc.key,region:dc.region||'other',name_vi:dc.name_vi,name_en:dc.name_en,name_ru:dc.name_ru,lat:dc.lat,lon:dc.lon,zoom:dc.zoom}
               :{key:k,region:'other',name_vi:name||k,name_en:name||k,name_ru:name||k}; }
  DB.restaurants.forEach(function(r){
    var ks=[];
    (r.cities||[]).forEach(function(n){ var k=M[String(n).trim().toLowerCase()]; if(!k){ k=slugify(n); ensure(k,n); } if(ks.indexOf(k)<0) ks.push(k); });
    if(!ks.length) (r.city_keys||[]).forEach(function(k){ ensure(k); if(ks.indexOf(k)<0) ks.push(k); });
    if(!ks.length){ ks=['chua-ro']; ensure('chua-ro', tr('Chưa rõ thành phố','Unknown city','Город не указан')); }
    r._ck=ks;
  });
  var all=cfg.concat(Object.keys(adhoc).map(function(k){ return adhoc[k]; }));
  all.forEach(function(c){ c.region=c.region||'other';
    if(!REGIONS.some(function(g){ return g.key===c.region; })) REGIONS.push({key:c.region,icon:'📍',name_vi:'Nơi khác',name_en:'Other places',name_ru:'Другие места'}); });
  REGIONS.forEach(function(g,i){ g._i=i; REGION_BY[g.key]=g; });
  var TYPE_ORDER={restaurant:0,traktir:1,cafe:2,chain:3}, nd={};
  DB.dishes.forEach(function(d){ nd[d.rid]=(nd[d.rid]||0)+1; });
  all.forEach(function(c,i){
    var rs=DB.restaurants.filter(function(r){ return r._ck.indexOf(c.key)>=0; });
    rs.sort(function(a,b){ var ta=TYPE_ORDER[a.type], tb=TYPE_ORDER[b.type]; ta=(ta==null?9:ta); tb=(tb==null?9:tb);
      return (ta-tb) || shortName(a).localeCompare(shortName(b)); });
    c.rests=rs; c.rset={}; c.nd={}; c.ndish=0; c._i=i;
    rs.forEach(function(r){ c.rset[r.id]=1; c.nd[r.id]=nd[r.id]||0; c.ndish+=(nd[r.id]||0); });
  });
  CITIES=all.filter(function(c){ return c.rests.length; });
  CITIES.sort(function(a,b){ return (REGION_BY[a.region]._i-REGION_BY[b.region]._i) || (a._i-b._i); });
  CITIES.forEach(function(c){ CITY_BY[c.key]=c; });
})();
function restCities(r){ return ((r&&r._ck)||[]).map(function(k){ var c=CITY_BY[k]; return c?L(c,'name'):k; }).join(', '); }

// ---------- ĐIỀU HƯỚNG bằng #: (trống)=chọn thành phố · #kolomna · #kolomna/<id quán> ----------
function parseHash(){ var h=(location.hash||'').replace(/^#\/?/,''); try{ h=decodeURIComponent(h); }catch(e){}
  var p=h.split('/'); return {city:p[0]||'', rest:p[1]||''}; }
function depth(){ return CITY?(REST?2:1):0; }
function go(city,rest){ var h=city?(city+(rest?'/'+rest:'')):''; var cur=(location.hash||'').replace(/^#/,'');
  if(cur===h){ route(); return; } location.hash=h; }
var SCROLL={};
function scopeList(){ return DB.dishes.filter(function(d){ return REST ? d.rid===REST : (CITY ? !!CITY_BY[CITY].rset[d.rid] : true); }); }
function fixFilters(){ if(!CITY){ CAT=''; VEG=false; return; } var s=scopeList();
  if(CAT && !s.some(function(d){ return d.cat===CAT; })) CAT='';
  if(VEG && !s.some(function(d){ return d.veg; })) VEG=false; }
function route(){
  var oldDepth=depth(); SCROLL[CITY+'/'+REST]=window.pageYOffset||0;     // nhớ chỗ đang cuộn của trang vừa rời
  var r=parseHash(), c=CITY_BY[r.city]?r.city:'';
  if(c!==CITY){ CAT=''; VEG=false; }
  CITY=c; REST=(c && r.rest && CITY_BY[c].rset[r.rest]) ? r.rest : '';
  fixFilters(); syncHeader(); render();
  var y=(depth()<oldDepth && SCROLL[CITY+'/'+REST]!=null) ? SCROLL[CITY+'/'+REST] : 0;   // quay lui -> về đúng chỗ cũ
  window.scrollTo(0,y);
}
window.addEventListener('hashchange', route);

function syncHeader(){
  var c=CITY_BY[CITY];
  document.getElementById('citylbl').textContent = c ? L(c,'name') : tr('Mọi thành phố','All cities','Все города');
  var b=document.getElementById('citybtn'); b.classList.toggle('on',!!c);
  b.title = tr('Chọn thành phố khác','Choose another city','Выбрать другой город');
  document.getElementById('q').placeholder = c
    ? tr('🔎 Tìm món ở ','🔎 Search dishes in ','🔎 Поиск блюд: ')+L(c,'name')+'…'
    : tr('🔎 Tìm món ở mọi nơi…','🔎 Search all cities…','🔎 Поиск во всех городах…');
  document.title=(c?L(c,'name')+' — ':'')+tr('Ẩm thực Nga · Quán ăn theo thành phố','Russian food · Where to eat, by city','Русская кухня · Где поесть по городам')+' · Cẩm nang Du lịch';
}

function onSearch(){ Q=document.getElementById('q').value.trim(); document.getElementById('qx').style.display=Q?'block':'none'; render(); }
function clearQ(){ var q=document.getElementById('q'); q.value=''; Q=''; document.getElementById('qx').style.display='none'; render(); q.focus(); }
function toFilters(){ var f=document.querySelector('.filters'); if(!f) return; var top=f.getBoundingClientRect().top, hh=document.querySelector('.hero').offsetHeight;
  if(top<hh) window.scrollTo(0, (window.pageYOffset||0)+top-hh-8); }
function setCat(slug){ CAT=(CAT===slug?'':slug); render(); toFilters(); }
function toggleVeg(){ VEG=!VEG; render(); toFilters(); }
function pickRest(id){ go(CITY,id); }
function filtered(){
  var terms=norm(Q).split(/\s+/).filter(Boolean);
  return scopeList().filter(function(d){
    if(CAT && d.cat!==CAT) return false;
    if(VEG && !d.veg) return false;
    for(var i=0;i<terms.length;i++){ if(d._s.indexOf(terms[i])<0) return false; }
    return true;
  });
}

function clearPlan(){ if(PLAN.length && !confirm(tr('Xoá hết món trong kế hoạch?','Clear all?','Очистить план?')))return; PLAN=[]; savePlan(); renderTray(); document.querySelectorAll('.addp.in').forEach(function(b){b.classList.remove('in');b.textContent='＋ '+tr('Kế hoạch','Plan','В план');}); }
function planLabel(){ return document.getElementById('planlabel').value.trim()||tr('Kế hoạch bữa ăn','Meal plan','План питания'); }
function planGroups(){ var g=[],idx={}; PLAN.forEach(function(id){var d=dishById(id); if(!d)return; if(!(d.rid in idx)){idx[d.rid]=g.length; g.push({r:REST_BY[d.rid]||{id:d.rid},items:[]});} g[idx[d.rid]].items.push(d);}); return g; }
// ---- tải file ----
function dl(content,type,name){ var b=new Blob([content],{type:type}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){a.remove();URL.revokeObjectURL(a.href);},200); }
function dlBlob(blob,name){ var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){a.remove();URL.revokeObjectURL(a.href);},200); }
function slugName(){ return norm(planLabel()).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'ke-hoach-bua-an'; }
function noplan(){ if(!PLAN.length){ alert(tr('Chưa chọn món nào.','No dishes selected.','Не выбрано.')); return true;} return false; }

// ---- Copy / text ----
function buildText(){ var L=[]; L.push('# '+planLabel()); planGroups().forEach(function(g){ L.push(''); L.push('== '+(g.r.name_vi||g.r.id)+(g.r.name_ru?(' ('+g.r.name_ru+')'):'')+(restCities(g.r)?' — '+restCities(g.r):'')+' =='); if(g.r.map_url)L.push('📍 '+g.r.map_url);
  g.items.forEach(function(d){ L.push(''); L.push('• '+d.name_vi+' | '+d.name_en+' | '+d.name_ru+(d.price?('  —  '+d.price+' ₽'):'')+(d.weight?(' ('+d.weight+')'):'')); if(d.intro_vi)L.push('   '+d.intro_vi); if(d.tips_vi)L.push('   ⚠ Lưu ý: '+d.tips_vi); }); }); return L.join('\n'); }
function copyPlan(){ if(noplan())return; var t=buildText(); if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){alert('✓ '+tr('Đã sao chép!','Copied!','Скопировано!'));},function(){prompt('Copy:',t);});} else prompt('Copy:',t); }

// ---- HTML / Print ----
function buildHTMLdoc(forPrint){
  var css='body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1e2733;max-width:800px;margin:auto;padding:24px;line-height:1.55}h1{color:#152c4e;margin:0 0 4px}h2{color:#152c4e;border-bottom:2px solid #c8a24b;padding-bottom:4px;margin:22px 0 8px;font-size:17px}.d{margin:0 0 12px;padding:9px 12px;border:1px solid #e7e3d6;border-radius:10px}.n{font-weight:800;color:#152c4e}.alt{color:#5c6773;font-style:italic;font-size:13px}.pr{color:#b23b34;font-weight:800}.tip{background:#fff8ec;border-left:3px solid #c8a24b;padding:5px 9px;border-radius:6px;margin-top:5px;font-size:13px;color:#5a4a1e}.mp a{color:#a9863a}@media print{.noprint{display:none}}';
  var h='<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(planLabel())+'</title><style>'+css+'</style></head><body>';
  if(forPrint) h+='<div class="noprint" style="text-align:right"><button onclick="window.print()" style="padding:8px 14px;font-weight:800;background:#c8a24b;border:none;border-radius:8px;cursor:pointer">🖨️ In / Lưu PDF</button></div>';
  h+='<h1>🧾 '+esc(planLabel())+'</h1><div class="alt">Cẩm nang Du lịch · thực đơn 3 ngôn ngữ · giá tham khảo (₽)</div>';
  planGroups().forEach(function(g){ h+='<h2>'+esc(g.r.name_vi||g.r.id)+(g.r.name_ru?(' <span class="alt">'+esc(g.r.name_ru)+'</span>'):'')+(restCities(g.r)?' <span class="alt">· 📍 '+esc(restCities(g.r))+'</span>':'')+'</h2>';
    if(g.r.map_url) h+='<div class="mp">📍 <a href="'+esc(g.r.map_url)+'" target="_blank">'+tr('Bản đồ Yandex','Yandex Map','Яндекс Карта')+'</a></div>';
    g.items.forEach(function(d){ h+='<div class="d"><div><span class="n">'+esc(d.name_vi)+'</span>'+(d.price?' — <span class="pr">'+esc(d.price)+' ₽</span>':'')+(d.weight?' <span class="alt">('+esc(d.weight)+')</span>':'')+'</div>'
      +'<div class="alt">'+esc(d.name_en)+' · '+esc(d.name_ru)+'</div>'
      +(d.intro_vi?'<div style="font-size:13.5px;margin-top:3px">'+esc(d.intro_vi)+'</div>':'')
      +(d.tips_vi?'<div class="tip">💡 '+esc(d.tips_vi)+'</div>':'')+'</div>'; }); });
  h+='</body></html>'; return h;
}
function exportHTMLfile(){ if(noplan())return; dl(buildHTMLdoc(false),'text/html;charset=utf-8;',slugName()+'.html'); }
function printPlan(){ if(noplan())return; var w=window.open('','_blank'); if(!w){alert(tr('Trình duyệt chặn cửa sổ in.','Popup blocked.','Всплывающее окно заблокировано.'));return;} w.document.write(buildHTMLdoc(true)); w.document.close(); w.focus(); }

// ---- CSV ----
function exportCSV(){ if(noplan())return;
  var head=['Nhan','Thanh_pho','Quan','Mon_VI','Mon_EN','Mon_RU','Dinh_luong','Gia_RUB','Danh_muc','Mo_ta','Luu_y','Ban_do'];
  var out=[head], lbl=planLabel();
  planGroups().forEach(function(g){ g.items.forEach(function(d){ out.push([lbl,restCities(g.r),g.r.name_vi||g.r.id,d.name_vi,d.name_en,d.name_ru,d.weight||'',d.price||'',catLabel(d.cat,'vi'),d.intro_vi||'',d.tips_vi||'',g.r.map_url||'']); }); });
  var csv='﻿'+out.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  dl(csv,'text/csv;charset=utf-8;',slugName()+'.csv');
}
// ---- JSON ----
function exportJSON(){ if(noplan())return;
  var data={label:planLabel(),generated:new Date().toISOString(),groups:planGroups().map(function(g){return {restaurant:{id:g.r.id,name_vi:g.r.name_vi,name_ru:g.r.name_ru,map_url:g.r.map_url||'',cities:restCities(g.r)},dishes:g.items.map(function(d){return {id:d.id,cat:d.cat,name_vi:d.name_vi,name_en:d.name_en,name_ru:d.name_ru,weight:d.weight,price:d.price,intro_vi:d.intro_vi,tips_vi:d.tips_vi};})};})};
  dl(JSON.stringify(data,null,2),'application/json;charset=utf-8;',slugName()+'.json');
}
// ---- Word .docx THẬT (OOXML + zip store, không cần thư viện ngoài) ----
function _crc32(u8){ var t=_crc32.t; if(!t){t=_crc32.t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}} var crc=-1;for(var i=0;i<u8.length;i++)crc=(crc>>>8)^t[(crc^u8[i])&0xFF];return (crc^-1)>>>0; }
function _zipStore(files){ var enc=new TextEncoder(),parts=[],central=[],offset=0;
  function u16(n){return [n&255,(n>>>8)&255];} function u32(n){n>>>=0;return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];} function put(a){parts.push(a);offset+=a.length;}
  files.forEach(function(f){ var name=enc.encode(f.name),data=(f.data instanceof Uint8Array)?f.data:enc.encode(f.data),crc=_crc32(data),off=offset;
    put(new Uint8Array([].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0)))); put(name); put(data);
    central.push({h:new Uint8Array([].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off))),n:name}); });
  var cdStart=offset,cdSize=0; central.forEach(function(c){put(c.h);put(c.n);cdSize+=c.h.length+c.n.length;});
  put(new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdSize),u32(cdStart),u16(0))));
  var total=0;parts.forEach(function(p){total+=p.length;}); var out=new Uint8Array(total),pos=0;parts.forEach(function(p){out.set(p,pos);pos+=p.length;}); return out; }
function buildPlanDocx(){
  var rels=[];
  function xe(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function run(t,o){o=o||{};var r='';if(o.b)r+='<w:b/>';if(o.i)r+='<w:i/>';if(o.color)r+='<w:color w:val="'+o.color+'"/>';if(o.sz)r+='<w:sz w:val="'+o.sz+'"/><w:szCs w:val="'+o.sz+'"/>';r=r?'<w:rPr>'+r+'</w:rPr>':'';var seg=String(t==null?'':t).split('\n'),tt='';for(var i=0;i<seg.length;i++){if(i)tt+='<w:br/>';tt+='<w:t xml:space="preserve">'+xe(seg[i])+'</w:t>';}return '<w:r>'+r+tt+'</w:r>';}
  function hyper(t,u){var id='rIdH'+(rels.length+1);rels.push({id:id,url:u});return '<w:hyperlink r:id="'+id+'"><w:r><w:rPr><w:color w:val="0563C1"/><w:u w:val="single"/></w:rPr><w:t xml:space="preserve">'+xe(t)+'</w:t></w:r></w:hyperlink>';}
  function para(inner,o){o=o||{};var p='';if(o.after!=null)p+='<w:spacing w:after="'+o.after+'"/>';if(o.bdr)p+='<w:pBdr><w:bottom w:val="single" w:sz="4" w:color="E0D9C0"/></w:pBdr>';p=p?'<w:pPr>'+p+'</w:pPr>':'';return '<w:p>'+p+(inner||'')+'</w:p>';}
  var body='';
  body+=para(run('🧾 '+planLabel(),{b:true,sz:34,color:'16293F'}),{after:40});
  body+=para(run('Cẩm nang Du lịch · thực đơn 3 ngôn ngữ · giá tham khảo (₽)',{color:'8A97A8',sz:18}),{after:140});
  planGroups().forEach(function(g){
    body+=para(run((g.r.name_vi||g.r.id),{b:true,sz:26,color:'16293F'})+run(g.r.name_ru?('   ·   '+g.r.name_ru):'',{i:true,sz:18,color:'8A97A8'})+run(restCities(g.r)?('   ·   📍 '+restCities(g.r)):'',{sz:18,color:'A9863A'}),{after:20});
    if(g.r.map_url) body+=para(run('📍 ',{sz:18,color:'8A97A8'})+hyper(tr('Bản đồ Yandex','Yandex Map','Яндекс'),g.r.map_url),{after:40});
    g.items.forEach(function(d){
      body+=para(run(d.name_vi,{b:true,sz:22,color:'16293F'})+(d.price?run('    '+d.price+' ₽'+(d.weight?(' · '+d.weight):''),{b:true,sz:20,color:'B23B34'}):''),{after:8});
      body+=para(run(d.name_en+'  ·  '+d.name_ru,{i:true,sz:16,color:'8A97A8'}),{after:8});
      if(d.intro_vi) body+=para(run(d.intro_vi,{sz:18}),{after:6});
      if(d.tips_vi) body+=para(run('💡 Lưu ý: ',{b:true,sz:16,color:'A9863A'})+run(d.tips_vi,{sz:16,color:'5A4A1E'}),{after:30,bdr:true});
    });
  });
  var docXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="900" w:right="900" w:bottom="900" w:left="900"/></w:sectPr></w:body></w:document>';
  var relsXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+rels.map(function(x){return '<Relationship Id="'+x.id+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="'+xe(x.url)+'" TargetMode="External"/>';}).join('')+'</Relationships>';
  var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>';
  var rootRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  var styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>';
  return _zipStore([{name:'[Content_Types].xml',data:ct},{name:'_rels/.rels',data:rootRels},{name:'word/document.xml',data:docXml},{name:'word/_rels/document.xml.rels',data:relsXml},{name:'word/styles.xml',data:styles}]);
}
function exportWord(){ if(noplan())return; try{ dlBlob(new Blob([buildPlanDocx()],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),slugName()+'.docx'); }catch(e){ dl('﻿'+buildHTMLdoc(false),'application/msword',slugName()+'.doc'); } }
// ---------- khởi động ----------
(function(){
  try{ history.scrollRestoration='manual'; }catch(e){}
  // link dạng ?city=kolomna (hoặc tên thành phố) -> chuyển thành #kolomna
  try{
    var qc=new URLSearchParams(location.search||'').get('city');
    if(qc && !location.hash){ var n=qc.trim().toLowerCase(), k='';
      CITIES.forEach(function(c){ if(!k && [c.key,c.name_vi,c.name_en,c.name_ru].concat(c.match||[]).some(function(x){ return x && String(x).toLowerCase()===n; })) k=c.key; });
      if(k) history.replaceState(null,'',location.pathname+location.search+'#'+k); }
  }catch(e){}
  var r=parseHash(); CITY=CITY_BY[r.city]?r.city:''; REST=(CITY&&r.rest&&CITY_BY[CITY].rset[r.rest])?r.rest:'';
  var l0='vi'; try{ l0=localStorage.getItem('rd_lang')||'vi'; }catch(e){}
  setLang(l0);
})();
</script>
