<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- SEO / share meta (static defaults; upgraded per-place by JS at load) -->
<title id="pageTitle">Địa điểm · Cẩm nang Du lịch</title>
<meta id="metaDesc" name="description" content="Chi tiết địa điểm du lịch tại Nga: giới thiệu, đánh giá, bản đồ và thông tin tham quan — đa ngôn ngữ Tiếng Việt / English / Русский." />
<meta property="og:type" content="article" />
<meta id="ogTitle" property="og:title" content="Cẩm nang Du lịch" />
<meta id="ogDesc" property="og:description" content="Chi tiết địa điểm du lịch tại Nga: giới thiệu, đánh giá, bản đồ và thông tin tham quan." />
<meta id="ogImage" property="og:image" content="assets/vendor/images/marker-icon-2x.png" />
<meta id="ogUrl" property="og:url" content="" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="stylesheet" href="assets/vendor/leaflet.css" />
<link rel="stylesheet" href="assets/app.css" />
<style>
  /* ---- Trang chi tiết địa điểm (mobile-first). Dùng lại biến của app.css, có fallback. ---- */
  :root {
    --navy: #152c4e;
    --gold: #c8a24b;
    --muted: #667085;
    --line: #e6e8ee;
  }
  .detail-wrap { max-width: 920px; margin: 0 auto; padding: 16px; }

  /* Language switcher */
  .lang-switch { display: flex; gap: 6px; margin-left: auto; }
  .lang-chip {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    border: 1.5px solid rgba(255,255,255,.28); background: rgba(255,255,255,.08);
    color: #fff; padding: 6px 11px; border-radius: 999px; font-size: 13px; font-weight: 700;
    line-height: 1; transition: .15s; font-family: inherit;
  }
  .lang-chip:hover { background: rgba(255,255,255,.18); }
  .lang-chip.active { background: var(--gold, #c8a24b); color: #241c05; border-color: var(--gold, #c8a24b); }

  /* Hero photo */
  .hero-photo {
    position: relative; width: 100%; height: clamp(200px, 46vw, 360px);
    border-radius: 16px; overflow: hidden; box-shadow: var(--shadow, 0 6px 22px rgba(20,30,50,.10));
    display: flex; align-items: center; justify-content: center; margin: 4px 0 16px;
  }
  .hero-photo .hero-emoji { font-size: clamp(56px, 16vw, 108px); filter: drop-shadow(0 3px 8px rgba(0,0,0,.35)); }
  .hero-photo .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-photo .cat-badge { position: absolute; left: 12px; top: 12px; z-index: 2; }

  .place-title { font-size: clamp(22px, 5.2vw, 32px); line-height: 1.2; margin: 2px 0 6px; color: var(--navy, #152c4e); }
  .place-sub { color: var(--muted, #667085); font-size: 14px; margin: 0 0 10px; display: flex; gap: 12px; flex-wrap: wrap; }
  .place-sub span { display: inline-flex; align-items: center; gap: 5px; }

  .rating-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; margin: 0 0 14px; }
  .rating-row b { font-size: 16px; }

  .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 18px; }
  .action-row .btn { flex: 0 1 auto; }

  #map { width: 100%; height: 260px; border-radius: 16px; border: 1px solid var(--line, #e6e8ee); margin: 4px 0 20px; background: #dfe7f0; z-index: 0; }
  .leaflet-popup-content { margin: 10px 12px; font-family: inherit; font-weight: 600; color: var(--navy, #152c4e); }

  .sec { margin: 0 0 22px; }
  .sec h2 {
    font-size: 15px; text-transform: uppercase; letter-spacing: .05em; color: var(--navy, #152c4e);
    margin: 0 0 10px; display: flex; align-items: center; gap: 9px;
  }
  .sec h2 .bar { width: 4px; height: 17px; border-radius: 2px; background: var(--gold, #c8a24b); display: inline-block; }
  .lead { font-size: 16px; color: #2c3949; margin: 0 0 6px; }
  .longtext { font-size: 15px; color: #35404f; margin: 0; white-space: pre-line; }

  .hl-list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  .hl-list li { font-size: 15px; }

  .practical {
    background: var(--card, #fff); border: 1px solid var(--line, #e6e8ee); border-radius: 14px;
    padding: 14px 16px; display: grid; gap: 9px; box-shadow: var(--shadow, 0 6px 22px rgba(20,30,50,.06));
  }
  .practical .row { display: grid; grid-template-columns: 1fr; gap: 2px; font-size: 14.5px; }
  .practical .row .k { color: var(--navy, #152c4e); font-weight: 700; }

  .meta-block { font-size: 13.5px; color: var(--muted, #667085); border-top: 1px dashed var(--line, #e6e8ee); padding-top: 14px; }
  .meta-block a { color: var(--navy, #152c4e); font-weight: 600; }
  .meta-block .line { margin: 4px 0; }

  /* Not found */
  .notfound { text-align: center; padding: 48px 16px; }
  .notfound .em { font-size: 60px; }
  .notfound h1 { color: var(--navy, #152c4e); margin: 10px 0 6px; font-size: 24px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
    background: var(--navy, #152c4e); color: #fff; padding: 11px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; box-shadow: 0 8px 26px rgba(0,0,0,.28);
    opacity: 0; pointer-events: none; transition: .25s; z-index: 3000; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (min-width: 640px) {
    .detail-wrap { padding: 24px; }
    .practical .row { grid-template-columns: 168px 1fr; gap: 10px; align-items: start; }
  }
</style>
</head>
<body>
<header class="site-header">
  <nav class="nav">
    <a class="brand" href="index.html"><img class="brand-logo" src="assets/favicon.svg" alt="" width="30" height="30" /><span class="brand-name">Cẩm nang Du lịch</span></a>
    <div class="nav-links" id="navLinks"></div>
    <div class="lang-switch" id="langSwitch"></div>
  </nav>
</header>

<main class="detail-wrap" id="app"><!-- rendered by JS --></main>

<footer class="site-footer">
  <div class="fwrap">
    <div>Cẩm nang Du lịch · Dữ liệu tiếng Việt, có toạ độ &amp; bản đồ · Mở rộng dần theo thời gian.</div>
    <div class="contact">Liên hệ: <b>Phạm Đăng Hiển</b> · <a href="mailto:lopmaybay@gmail.com">lopmaybay@gmail.com</a> · <a href="https://fb.com/lopmaybay" target="_blank" rel="noopener">fb.com/lopmaybay</a></div>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/vendor/leaflet.js"></script>
<script src="assets/common.js"></script>
<script src="data/bundle.js"></script>
<script>
(function () {
  "use strict";
  var esc = RT.escapeHtml;

  /* ---- Nhãn phụ không có sẵn trong RT.uiText ---- */
  var WORDS = {
    reviews:     { vi: "đánh giá",  en: "reviews",       ru: "отзывов" },
    sources:     { vi: "Nguồn",     en: "Sources",       ru: "Источники" },
    official:    { vi: "Web chính thức", en: "Official site", ru: "Официальный сайт" },
    coords:      { vi: "Toạ độ",    en: "Coordinates",   ru: "Координаты" },
    notFound:    { vi: "Không tìm thấy địa điểm", en: "Place not found", ru: "Место не найдено" },
    notFoundSub: { vi: "Địa điểm bạn tìm không tồn tại, hoặc liên kết đã cũ.", en: "The place you are looking for does not exist or the link is outdated.", ru: "Запрашиваемое место не существует или ссылка устарела." },
    back:        { vi: "← Về danh sách", en: "← Back to list", ru: "← К списку" },
    copied:      { vi: "Đã sao chép link", en: "Link copied", ru: "Ссылка скопирована" },
    mapView:     { vi: "Bản đồ tương tác", en: "Interactive map", ru: "Интерактивная карта" }
  };
  function w(key) { var e = WORDS[key]; var l = RT.getLang(); return e ? (e[l] || e.vi) : key; }

  /* ---- Tìm địa điểm theo ?id= (fallback ?slug=) ---- */
  var params = new URLSearchParams(location.search || "");
  var qid = params.get("id");
  var qslug = params.get("slug");
  var places = RT.getPlaces();
  function findBy(field, val) {
    if (!val) return null;
    for (var i = 0; i < places.length; i++) { if (places[i][field] === val) return places[i]; }
    return null;
  }
  var place = findBy("id", qid) || findBy("slug", qslug) || findBy("slug", qid) || findBy("id", qslug);

  var app = document.getElementById("app");
  var toastEl = document.getElementById("toast");
  var mapInstance = null;
  var toastTimer = null;

  /* ---- Language switcher (luôn hiển thị) ---- */
  (function buildLangSwitch() {
    var box = document.getElementById("langSwitch");
    Object.keys(RT.LANGS).forEach(function (code) {
      var info = RT.LANGS[code];
      var b = document.createElement("button");
      b.type = "button";
      b.className = "lang-chip";
      b.dataset.code = code;
      b.setAttribute("aria-label", info.label);
      b.title = info.label;
      b.innerHTML = info.flag + " <span>" + esc(code.toUpperCase()) + "</span>";
      b.onclick = function () {
        if (RT.getLang() === code) return;
        RT.TTS.stop();
        RT.setLang(code);
        rerender();
      };
      box.appendChild(b);
    });
  })();
  function markLang() {
    var cur = RT.getLang();
    document.querySelectorAll(".lang-chip").forEach(function (c) {
      c.classList.toggle("active", c.dataset.code === cur);
    });
    document.documentElement.lang = cur;
  }

  /* ---- Back link in header ---- */
  function renderNav() {
    document.getElementById("navLinks").innerHTML =
      '<a href="list.html">' + esc(w("back")) + '</a>';
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }

  /* ---- NOT FOUND view (khi không tìm thấy id/slug) ---- */
  function renderNotFound() {
    renderNav();
    app.innerHTML =
      '<div class="notfound">' +
        '<div class="em">🧭</div>' +
        '<h1>' + esc(w("notFound")) + '</h1>' +
        '<p class="muted">' + esc(w("notFoundSub")) + '</p>' +
        '<p style="margin-top:18px;"><a class="btn primary" href="list.html">' + esc(w("back")) + '</a></p>' +
      '</div>';
    markLang();
  }

  /* ---- Bộ điều phối render (có / không có địa điểm) ---- */
  function rerender() { if (place) render(); else renderNotFound(); }

  /* ---- Helpers cho trang chi tiết ---- */
  function localName() { return RT.t(place, "name") || place.name_vi || ""; }

  function otherNamesHTML() {
    var cur = RT.getLang();
    var out = [];
    Object.keys(RT.LANGS).forEach(function (code) {
      if (code === cur) return;
      var nm = place["name_" + code];
      if (nm) out.push('<span>' + RT.LANGS[code].flag + " " + esc(nm) + "</span>");
    });
    return out.join("");
  }

  function heroHTML() {
    var info = RT.catInfo(RT.primaryCat(place));
    var grad = "linear-gradient(135deg," + info.color + ",#16293f)";
    var img = place.photo
      ? '<img class="hero-img" src="' + esc(place.photo) + '" alt="' + esc(localName()) +
        '" onerror="this.style.display=\'none\'">'
      : "";
    return '' +
      '<div class="hero-photo" style="background:' + grad + '">' +
        '<div class="hero-emoji">' + info.emoji + '</div>' +
        img +
        '<div class="cat-badge"><span class="chip" style="background:' + info.color + '">' +
          info.emoji + " " + esc(info.vi) + '</span></div>' +
      '</div>';
  }

  function ratingHTML() {
    var rt = place.rating || {};
    var parts = RT.starHTML(rt.value);
    if (rt.value != null) parts += "<b>" + esc(String(rt.value)) + "</b>";
    if (rt.count != null) {
      parts += '<span class="muted">· ' + esc(RT.fmtCount(rt.count)) + " " + esc(w("reviews")) +
        (rt.source ? " · " + esc(rt.source) : "") + "</span>";
    }
    return '<div class="rating-row">' + parts + "</div>";
  }

  function actionsHTML() {
    var m = place.maps || {};
    return '<div class="action-row">' +
      '<button type="button" class="btn gold" id="btnShort">' + esc(RT.uiText("listen")) + '</button>' +
      '<button type="button" class="btn" id="btnLong">' + esc(RT.uiText("listenLong")) + '</button>' +
      (m.yandex ? '<a class="btn" href="' + esc(m.yandex) + '" target="_blank" rel="noopener">📍 Yandex</a>' : '') +
      (m.google ? '<a class="btn" href="' + esc(m.google) + '" target="_blank" rel="noopener">🗺️ Google</a>' : '') +
      '<button type="button" class="btn" id="btnShare">' + esc(RT.uiText("share")) + '</button>' +
      '<a class="btn" id="btnFb" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=' +
        encodeURIComponent(location.href) + '">📘 Facebook</a>' +
    '</div>';
  }

  function section(title, inner) {
    return '<div class="sec"><h2><span class="bar"></span>' + esc(title) + "</h2>" + inner + "</div>";
  }

  function highlightsHTML() {
    var hl = RT.tArr(place, "highlights") || [];
    if (!hl.length) return "";
    var lis = hl.map(function (h) { return "<li>" + esc(h) + "</li>"; }).join("");
    return section(RT.uiText("highlights"), '<ul class="hl-list">' + lis + "</ul>");
  }

  function practicalHTML() {
    var pr = place.practical || {};
    var rows = [];
    function row(emoji, label, val) {
      if (!val) return;
      rows.push('<div class="row"><div class="k">' + emoji + " " + esc(label) + '</div><div>' + esc(val) + "</div></div>");
    }
    row("🕒", RT.uiText("hours"), pr.hours_vi);
    row("🎟️", RT.uiText("ticket"), pr.ticket_vi);
    row("⏱️", RT.uiText("duration"), pr.duration_vi);
    row("🌤️", RT.uiText("bestTime"), pr.best_time_vi);
    row("💡", RT.uiText("tips"), pr.tips_vi);
    row("📮", RT.uiText("address"), place.address_vi);
    if (!rows.length) return "";
    return section(RT.uiText("visitInfo"), '<div class="practical">' + rows.join("") + "</div>");
  }

  function metaHTML() {
    var lines = [];
    var srcs = (place.sources || []).map(function (s) {
      return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title || s.url) + "</a>";
    }).join(" · ");
    if (place.official_site) {
      lines.push('<div class="line">🌐 ' + esc(w("official")) + ': <a href="' + esc(place.official_site) +
        '" target="_blank" rel="noopener">' + esc(place.official_site) + "</a></div>");
    }
    if (srcs) lines.push('<div class="line">📚 ' + esc(w("sources")) + ": " + srcs + "</div>");
    var c = place.coordinates || {};
    if (c.lat != null && c.lon != null) {
      lines.push('<div class="line">📍 ' + esc(w("coords")) + ": " +
        Number(c.lat).toFixed(5) + ", " + Number(c.lon).toFixed(5) + "</div>");
    }
    if (!lines.length) return "";
    return '<div class="meta-block">' + lines.join("") + "</div>";
  }

  /* ---- Cập nhật <head> cho SEO/chia sẻ theo địa điểm ---- */
  function updateHead() {
    var nm = localName();
    var desc = RT.t(place, "presentation_short") || nm;
    var titleFull = nm + " · Cẩm nang Du lịch";
    document.title = titleFull;
    function set(id, val) { var el = document.getElementById(id); if (el) el.setAttribute("content", val); }
    set("metaDesc", desc);
    set("ogTitle", nm);
    set("ogDesc", desc);
    set("ogUrl", location.href);
    if (place.photo) set("ogImage", place.photo);
  }

  /* ---- Bản đồ Leaflet nhúng ---- */
  function initMap() {
    var el = document.getElementById("map");
    if (!el) return;
    var c = place.coordinates || {};
    if (typeof L === "undefined" || c.lat == null || c.lon == null) {
      el.innerHTML = '<div style="padding:24px;text-align:center;color:#667085;">' +
        '⚠️ ' + esc(w("mapView")) + ' — Leaflet.</div>';
      return;
    }
    var center = [Number(c.lat), Number(c.lon)];
    mapInstance = L.map(el, { scrollWheelZoom: false, zoomControl: true }).setView(center, 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "&copy; OpenStreetMap"
    }).addTo(mapInstance);
    var info = RT.catInfo(RT.primaryCat(place));
    var icon = L.divIcon({
      className: "rt-pin",
      html: '<div style="width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);' +
        'background:' + info.color + ';border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);' +
        'display:flex;align-items:center;justify-content:center;">' +
        '<span style="transform:rotate(45deg);font-size:15px;">' + info.emoji + '</span></div>',
      iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -30]
    });
    L.marker(center, { icon: icon }).addTo(mapInstance)
      .bindPopup("<b>" + esc(localName()) + "</b>");
    // Leaflet cần đo lại kích thước khi container vừa được chèn
    setTimeout(function () { if (mapInstance) mapInstance.invalidateSize(); }, 60);
  }

  /* ---- Chia sẻ ---- */
  function fallbackCopy(url) {
    try {
      var ta = document.createElement("textarea");
      ta.value = url; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.top = "-1000px";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      toast(w("copied"));
    } catch (e) { toast(url); }
  }
  function doShare() {
    var url = location.href;
    var title = localName();
    var text = RT.t(place, "presentation_short") || title;
    if (navigator.share) {
      navigator.share({ title: title, text: text, url: url }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { toast(w("copied")); }, function () { fallbackCopy(url); });
    } else {
      fallbackCopy(url);
    }
  }

  /* ---- TTS ---- */
  function bindTTS() {
    function speak(kind, btn) {
      var txt = kind === "long" ? RT.t(place, "presentation_long") : RT.t(place, "presentation_short");
      if (!txt) return;
      var uid = place.id + ":" + kind;
      if (RT.TTS.activeId === uid) { RT.TTS.stop(); return; }
      RT.TTS.speak(txt, {
        id: uid,
        lang: RT.getLang(),
        onState: function (st) {
          document.querySelectorAll("#btnShort,#btnLong").forEach(function (b) { b.classList.remove("speaking"); });
          if (st === "start") btn.classList.add("speaking");
        }
      });
    }
    var bs = document.getElementById("btnShort");
    var bl = document.getElementById("btnLong");
    if (bs) bs.onclick = function () { speak("short", bs); };
    if (bl) bl.onclick = function () { speak("long", bl); };
  }

  /* ---- Render toàn trang ---- */
  function render() {
    RT.TTS.stop();
    if (mapInstance) { try { mapInstance.remove(); } catch (e) {} mapInstance = null; }

    renderNav();
    updateHead();

    var shortPres = RT.t(place, "presentation_short");
    var longPres = RT.t(place, "presentation_long");
    var review = RT.t(place, "review_summary");

    var html = "";
    html += heroHTML();
    html += '<h1 class="place-title">' + esc(localName()) + "</h1>";
    var others = otherNamesHTML();
    if (others) html += '<div class="place-sub">' + others + "</div>";
    html += ratingHTML();
    html += actionsHTML();
    html += '<div id="map" aria-label="' + esc(w("mapView")) + '"></div>';

    if (shortPres) html += '<p class="lead">' + esc(shortPres) + "</p>";
    if (longPres) html += section(RT.uiText("detailPres"), '<p class="longtext">' + esc(longPres) + "</p>");

    html += highlightsHTML();
    html += practicalHTML();
    if (review) html += section(RT.uiText("reviews"), '<p class="longtext">' + esc(review) + "</p>");
    html += metaHTML();

    app.innerHTML = html;

    markLang();
    initMap();
    bindTTS();
    document.getElementById("btnShare").onclick = doShare;
  }

  rerender();
})();
</script>
</body>
</html>
